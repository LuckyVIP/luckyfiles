<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry Dash — LuckyFiles</title>

    <link rel="icon" type="image/png" href="https://i.postimg.cc/Y0pK8C0C/Nikita-red-back.png" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ===== ПЕРЕМЕННЫЕ (как на основном сайте) ===== */
        :root {
            --bg: #f6f9fc;
            --bg-card: #ffffff;
            --text: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow: rgba(0, 0, 0, 0.04);
            --shadow-hover: rgba(0, 0, 0, 0.08);
            --gradient-start: #3b82f6;
            --gradient-end: #8b5cf6;
            --btn-bg: #1e293b;
            --btn-text: #ffffff;
            --btn-hover: #0f172a;
        }

        [data-theme="dark"] {
            --bg: #0a0a0f;
            --bg-card: #18181f;
            --text: #e9e9f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a82;
            --border: #2a2a35;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.5);
            --gradient-start: #4f8df7;
            --gradient-end: #9b6cf7;
            --btn-bg: #3b3b4a;
            --btn-text: #ffffff;
            --btn-hover: #4f4f62;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            padding: 1rem;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* ===== НАВИГАЦИЯ (увеличенная) ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-logo i {
            -webkit-text-fill-color: var(--gradient-start);
            margin-right: 6px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .theme-toggle,
        .nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-family: inherit;
        }

        .theme-toggle:hover,
        .nav-btn:hover {
            background: var(--border);
            transform: scale(1.02);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            border: none;
        }

        /* ===== ИГРА ===== */
        .game-wrapper {
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 1.5rem;
            box-shadow: 0 8px 28px var(--shadow);
            transition: 0.3s;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .game-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .score-container {
            display: flex;
            gap: 20px;
            font-weight: 700;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 400px;
            background: #1a1a2e;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--border);
            cursor: pointer;
        }

        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, #2d2d44, #1a1a2e);
            border-top: 3px solid #4a4a6a;
        }

        .player {
            position: absolute;
            left: 80px;
            width: 40px;
            height: 40px;
            background-size: cover;
            background-position: center;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(79, 141, 247, 0.6);
            z-index: 10;
            transition: none;
            will-change: transform;
            cursor: pointer;
        }

        .obstacle {
            position: absolute;
            bottom: 60px;
            z-index: 5;
        }

        .spike::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ef4444;
            clip-path: polygon(0% 100%, 50% 0%, 100% 100%);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        /* ===== МУЗЫКАЛЬНЫЙ ПЛЕЕР ===== */
        .music-player {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 0.5rem 1rem;
            background: var(--bg);
            border-radius: 40px;
            border: 1px solid var(--border);
        }

        .music-player button {
            background: transparent;
            border: none;
            color: var(--gradient-start);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            padding: 0.2rem 0.5rem;
        }

        .music-player button:hover {
            transform: scale(1.1);
        }

        .music-player .volume-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border);
            border-radius: 4px;
            outline: none;
        }

        .music-player .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--gradient-start);
            cursor: pointer;
        }

        /* ===== GAME OVER ===== */
        .game-over {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            z-index: 20;
            text-align: center;
            padding: 1rem;
        }

        .game-over.show {
            display: flex;
        }

        .game-over h1 {
            font-size: 2.5rem;
            color: #ef4444;
            margin-bottom: 0.3rem;
        }

        .game-over p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .new-record {
            color: #ffd700;
            font-size: 1.1rem;
            margin-top: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .hint {
            text-align: center;
            color: var(--text-muted);
            margin-top: 0.8rem;
            font-size: 0.85rem;
        }

        .hint small {
            opacity: 0.6;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }

            .nav-controls {
                justify-content: center;
            }

            .theme-toggle,
            .nav-btn {
                font-size: 0.75rem;
                padding: 0.35rem 0.7rem;
            }

            .nav-logo {
                text-align: center;
                font-size: 1.5rem;
            }

            .game-container {
                height: 300px;
            }

            .player {
                width: 32px;
                height: 32px;
                left: 60px;
            }

            .game-over h1 {
                font-size: 2rem;
            }

            .music-player .volume-slider {
                width: 50px;
            }
        }

        @media (max-width: 480px) {
            .game-container {
                height: 250px;
            }

            .player {
                width: 28px;
                height: 28px;
                left: 50px;
            }

            .game-header h2 {
                font-size: 1rem;
            }

            .score-container {
                font-size: 0.85rem;
                gap: 10px;
            }

            .game-over h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== НАВИГАЦИЯ ===== -->
        <nav class="navbar">
            <a href="index.html" class="nav-logo">
                <i class="fas fa-clover"></i> LuckyFiles
            </a>

            <div class="nav-controls">
                <button class="theme-toggle" onclick="toggleTheme()">
                    <i class="fas fa-moon" id="themeIcon"></i> <span id="themeLabel">Тёмная</span>
                </button>

                <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Главная</a>
                <a href="programs.html" class="nav-btn"><i class="fas fa-th-list"></i> Программы</a>
                <a href="modpacks.html" class="nav-btn"><i class="fas fa-cubes"></i> Модпаки</a>
                <a href="geometry.html" class="nav-btn active"><i class="fas fa-gamepad"></i> Geometry</a>
            </div>
        </nav>

        <!-- ==============================================================
        ИГРА
        ============================================================== -->
        <div class="game-wrapper">
            <div class="game-header">
                <h2>🎮 Geometry Dash</h2>
                <div class="score-container">
                    <div><i class="fas fa-star"></i> <span id="scoreDisplay">0</span></div>
                    <div style="color:#ffd700;"><i class="fas fa-trophy"></i> <span id="highScoreDisplay">0</span></div>
                </div>
            </div>

            <div class="game-container" id="gameContainer">
                <div class="ground"></div>
                <div class="player" id="player"></div>

                <div class="game-over" id="gameOver">
                    <h1>💀 GAME OVER</h1>
                    <p>Твой счёт: <span id="finalScore">0</span></p>
                    <div id="recordMessage" class="new-record" style="display:none;">🎉 Новый рекорд!</div>
                    <div style="margin:15px 0;font-size:1.1rem;">Лучший: <span id="finalHighScore" style="color:#ffd700;"></span></div>
                    <button onclick="restartGame()" style="padding:0.7rem 2.5rem;background:linear-gradient(135deg,var(--gradient-start),var(--gradient-end));color:white;border:none;border-radius:50px;font-size:1.1rem;cursor:pointer;font-family:inherit;">
                        <i class="fas fa-redo"></i> Играть снова
                    </button>
                </div>
            </div>

            <!-- ===== МУЗЫКАЛЬНЫЙ ПЛЕЕР ===== -->
            <div class="music-player">
                <button id="playBtn" onclick="toggleMusic()">
                    <i class="fas fa-play" id="playIcon"></i>
                </button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" />
                <span style="color:var(--text-muted); font-size:0.8rem; opacity:0.7;">
                    <i class="fas fa-volume-up"></i>
                </span>
                <span style="color:var(--text-muted); font-size:0.75rem; margin-left:auto;">
                    <span id="musicStatus">Выкл</span>
                </span>
            </div>

            <div class="hint">
                <i class="fas fa-keyboard"></i> <strong>ПРОБЕЛ</strong> или <strong>КЛИК</strong> по полю — прыжок<br>
                <small>Клик по кубику — сменить иконку</small>
            </div>
        </div>

    </div>

    <!-- ================================================================
    АУДИО (фоновая музыка)
    ================================================================ -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/audio/2022/02/02/audio_fc4f3d0a16.mp3" type="audio/mpeg" />
        <source src="https://www.bensound.com/bensound-music/bensound-slowmotion.mp3" type="audio/mpeg" />
    </audio>

    <!-- ================================================================
    JAVASCRIPT
    ================================================================ -->
    <script>
        // ================================================================
        // ТЁМНАЯ ТЕМА (как на основном сайте)
        // ================================================================

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute("data-theme");
            const newTheme = current === "dark" ? "light" : "dark";
            html.setAttribute("data-theme", newTheme);

            const icon = document.getElementById("themeIcon");
            const label = document.getElementById("themeLabel");

            if (newTheme === "dark") {
                icon.className = "fas fa-sun";
                label.textContent = "Светлая";
            } else {
                icon.className = "fas fa-moon";
                label.textContent = "Тёмная";
            }

            localStorage.setItem("luckyfiles_theme", newTheme);
        }

        const savedTheme = localStorage.getItem("luckyfiles_theme");
        if (savedTheme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document.getElementById("themeIcon").className = "fas fa-sun";
            document.getElementById("themeLabel").textContent = "Светлая";
        }

        // ================================================================
        // МУЗЫКА
        // ================================================================

        const bgMusic = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicStatus = document.getElementById('musicStatus');

        let isMusicPlaying = false;

        // Восстановление состояния
        const musicState = localStorage.getItem('gd_music_state');
        const savedVolume = localStorage.getItem('gd_music_volume');

        if (savedVolume !== null) {
            bgMusic.volume = parseFloat(savedVolume);
            volumeSlider.value = savedVolume;
        }

        if (musicState === 'playing') {
            bgMusic.play().catch(() => {});
            isMusicPlaying = true;
            playIcon.className = 'fas fa-pause';
            musicStatus.textContent = 'Вкл';
        }

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                isMusicPlaying = false;
                playIcon.className = 'fas fa-play';
                musicStatus.textContent = 'Выкл';
                localStorage.setItem('gd_music_state', 'paused');
            } else {
                bgMusic.play().catch(() => {
                    alert('Не удалось запустить музыку. Нажмите ещё раз.');
                });
                isMusicPlaying = true;
                playIcon.className = 'fas fa-pause';
                musicStatus.textContent = 'Вкл';
                localStorage.setItem('gd_music_state', 'playing');
            }
        }

        volumeSlider.addEventListener('input', function() {
            bgMusic.volume = parseFloat(this.value);
            localStorage.setItem('gd_music_volume', this.value);
        });

        // Автозапуск после клика (обходит политику автовоспроизведения)
        document.addEventListener('click', function firstClick() {
            if (!isMusicPlaying && localStorage.getItem('gd_music_state') === 'playing') {
                bgMusic.play().catch(() => {});
                isMusicPlaying = true;
                playIcon.className = 'fas fa-pause';
                musicStatus.textContent = 'Вкл';
            }
            document.removeEventListener('click', firstClick);
        }, { once: true });

        // ================================================================
        // ИГРА (твой код)
        // ================================================================

        const container = document.getElementById('gameContainer');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScoreDisplay = document.getElementById('finalScore');
        const finalHighScoreDisplay = document.getElementById('finalHighScore');
        const recordMessage = document.getElementById('recordMessage');
        const gameOverEl = document.getElementById('gameOver');

        let isGameOver = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('gdHighScore')) || 0;
        let velocity = 0;
        let playerY = 0;
        let rotation = 0;
        let gameSpeed = 5;
        let spawnTimer = 0;
        let spawnInterval = 70;
        let obstacles = [];
        let animationId = null;

        const GROUND_HEIGHT = 60;
        const PLAYER_SIZE = 40;
        const PLAYER_X = 80;
        const GRAVITY = -0.65;
        const JUMP = 14.5;

        let currentSkin = 0;
        const skins = [
            "https://i.imgur.com/gvWGGy6.gif",
            "https://i.imgur.com/No8axGh.png",
            "https://i.imgur.com/kpLd5V2.png",
            "https://i.imgur.com/JBqjMQo.png"
        ];

        function setPlayerSkin() {
            player.style.backgroundImage = `url('${skins[currentSkin]}')`;
        }

        function changeSkin() {
            currentSkin = (currentSkin + 1) % skins.length;
            setPlayerSkin();
        }

        function updateHighScoreDisplay() {
            highScoreDisplay.textContent = highScore;
        }

        function spawnObstacle() {
            const obs = document.createElement('div');
            obs.className = 'obstacle';
            obs.style.right = '-40px';
            const height = Math.random() < 0.5 ? 40 : 55;
            obs.innerHTML = `<div class="spike" style="width:32px;height:${height}px"></div>`;
            container.appendChild(obs);

            obstacles.push({
                element: obs,
                x: container.offsetWidth + 20,
                width: 32,
                height: height
            });
        }

        function updateGame() {
            if (isGameOver) return;

            velocity += GRAVITY;
            playerY += velocity;

            if (playerY <= 0) {
                playerY = 0;
                velocity = 0;
                rotation = Math.round(rotation / 90) * 90;
            }
            if (playerY > 280) playerY = 280;

            player.style.bottom = `${GROUND_HEIGHT + playerY}px`;
            player.style.transform = `rotate(${rotation}deg)`;

            if (playerY > 5) rotation += 8;

            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnTimer = 0;
                spawnInterval = Math.max(45, 70 - Math.floor(score / 15));
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= gameSpeed;
                obs.element.style.right = `${container.offsetWidth - obs.x}px`;

                if (
                    PLAYER_X + PLAYER_SIZE - 8 > obs.x &&
                    PLAYER_X + 8 < obs.x + obs.width &&
                    playerY + PLAYER_SIZE - 8 > 0 &&
                    playerY + 8 < obs.height
                ) {
                    gameOver();
                    return;
                }

                if (obs.x < -50) {
                    obs.element.remove();
                    obstacles.splice(i, 1);
                    score++;
                    scoreDisplay.textContent = score;
                    gameSpeed = Math.min(9.5, 5 + Math.floor(score / 30));
                }
            }

            animationId = requestAnimationFrame(updateGame);
        }

        function gameOver() {
            if (isGameOver) return;
            isGameOver = true;
            cancelAnimationFrame(animationId);

            let isNewRecord = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('gdHighScore', highScore);
                isNewRecord = true;
            }

            finalScoreDisplay.textContent = score;
            finalHighScoreDisplay.textContent = highScore;
            updateHighScoreDisplay();

            if (isNewRecord) {
                recordMessage.style.display = 'block';
            }

            gameOverEl.classList.add('show');
        }

        function jump() {
            if (isGameOver || playerY > 8) return;
            velocity = JUMP;
        }

        function restartGame() {
            obstacles.forEach(o => o.element.remove());
            obstacles = [];
            score = 0;
            scoreDisplay.textContent = '0';
            velocity = 0;
            playerY = 0;
            rotation = 0;
            gameSpeed = 5;
            spawnTimer = 0;
            spawnInterval = 70;
            isGameOver = false;
            recordMessage.style.display = 'none';
            gameOverEl.classList.remove('show');

            player.style.bottom = `${GROUND_HEIGHT}px`;
            player.style.transform = 'rotate(0deg)';
            updateGame();
        }

        // Управление
        container.addEventListener('click', (e) => {
            if (e.target.id === 'player') {
                changeSkin();
            } else {
                jump();
            }
        });

        document.addEventListener('keydown', e => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                jump();
            }
            if (e.key === 'Enter' && isGameOver) restartGame();
        });

        // Инициализация
        updateHighScoreDisplay();
        setPlayerSkin();
        player.style.bottom = `${GROUND_HEIGHT}px`;
        updateGame();

        console.log('🎮 Geometry Dash с музыкой и единой темой!');
    </script>

</body>
</html>
